name: AQI Pipeline

on:
  schedule:
    # Daily backfill and training at 00:00 UTC (05:00 PKT)
    - cron: '0 0 * * *'
    # Forecast every 3 hours
    - cron: '0 */3 * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  backfill-and-train:
    # Only run for daily schedule (00:00 UTC)
    if: github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: improved

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Adjust if needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost shap openmeteo-requests requests-cache retry-requests

      - name: Run backfill script
        run: python backfill_new.py
        env:
          PYTHONPATH: .

      - name: Run training script
        run: python model_testing_new.py
        env:
          PYTHONPATH: .

      - name: Commit and push data/model changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data/ model/
          git commit -m "Update historical data and trained models [ci skip]" || echo "No changes to commit"
          git push origin improved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  forecast:
    # Only run for 3-hourly schedule
    if: github.event.schedule == '0 */3 * * *'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: improved

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost shap openmeteo-requests requests-cache retry-requests

      - name: Run forecast script
        run: python forecast_aqi_new.py
        env:
          PYTHONPATH: .

      - name: Commit and push forecast outputs
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@gmail.com"
          git add data/
          git commit -m "Update AQI predictions and SHAP plots [ci skip]" || echo "No changes to commit"
          git push origin improved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}